<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MGO ERP</title>

    <!-- Motor de Diseño Estético Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de App Nativa (PWA) -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MGO ERP" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link id="favicon-png" rel="icon" type="image/png" sizes="512x512" href="/mgo-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/mgo-icon.svg" />
    <link id="apple-icon-png" rel="apple-touch-icon" sizes="512x512" href="/mgo-icon.svg" />
    <link id="manifest-link" rel="manifest" href="/manifest.json" />

    <!-- Convierte el SVG en PNG 512x512 real directamente en Chrome/Safari -->
    <script>
      (function () {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 512, 512);
          const pngUrl = canvas.toDataURL('image/png');

          const fav = document.getElementById('favicon-png');
          const appIcon = document.getElementById('apple-icon-png');
          if (fav) fav.href = pngUrl;
          if (appIcon) appIcon.href = pngUrl;

          const dynamicManifest = {
            name: "MGO Events ERP",
            short_name: "MGO ERP",
            start_url: window.location.origin + "/",
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#0D4F8B",
            icons: [
              { src: pngUrl, sizes: "192x192", type: "image/png", purpose: "any" },
              { src: pngUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
            ]
          };
          const blob = new Blob([JSON.stringify(dynamicManifest)], { type: 'application/json' });
          const manifestEl = document.getElementById('manifest-link');
          if (manifestEl) manifestEl.href = URL.createObjectURL(blob);
        };
        img.src = '/mgo-icon.svg';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
